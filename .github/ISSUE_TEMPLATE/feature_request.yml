name: Feature request
description: Suggest an improvement to MsPacmanRipper
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep requests focused on MsPacmanRipper's validation, disassembly, reconstruction, portability, or tooling scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or workflow are you trying to improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
