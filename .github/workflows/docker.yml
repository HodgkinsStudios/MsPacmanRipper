# Created by Jacob Hodgkins
name: Docker build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/hodgkinsstudios/mspacmanripper

jobs:
  test:
    name: Test ${{ matrix.arch }} Linux image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build native ${{ matrix.arch }} test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: mspacripper:test-${{ matrix.arch }}
          build-args: |
            MSPACMANRIPPER_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(docker run --rm --entrypoint /bin/uname mspacripper:test-${{ matrix.arch }} -m)"
          echo "Container machine: $ACTUAL"
          test "$ACTUAL" = "${{ matrix.machine }}"

      - name: Smoke test executable and ZIP loader
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm mspacripper:test-${{ matrix.arch }} --version
          docker run --rm mspacripper:test-${{ matrix.arch }} --help >/dev/null

          rm -rf docker-ci
          mkdir -p docker-ci/output
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('docker-ci/smoke.zip', 'w') as z:
              z.writestr('pacman.6e', bytes(4096))
          PY

          set +e
          OUTPUT="$(docker run --rm \
            -v "$PWD/docker-ci:/work" \
            mspacripper:test-${{ matrix.arch }} /work/smoke.zip /work/output 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$RC" -eq 1
          grep -q "canonical Ms. Pac-Man validation failed" <<<"$OUTPUT"

      - name: Smoke test host-user helper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x run_docker.sh
          rm -rf docker-ci/helper-output
          set +e
          OUTPUT="$(MSPACMANRIPPER_IMAGE=mspacripper:test-${{ matrix.arch }} \
            ./run_docker.sh docker-ci/smoke.zip docker-ci/helper-output 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$RC" -eq 1
          grep -q "canonical Ms. Pac-Man validation failed" <<<"$OUTPUT"
          test "$(stat -c '%u' docker-ci/helper-output)" = "$(id -u)"

  publish:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-platform assembly
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            MSPACMANRIPPER_VERSION=${{ steps.version.outputs.version }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
            type=gha,scope=docker-publish
          cache-to: type=gha,mode=max,scope=docker-publish

      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.version.outputs.version }}" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt

      - name: Build portable OCI archive
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg MSPACMANRIPPER_VERSION="${{ steps.version.outputs.version }}" \
            --cache-from type=gha,scope=docker-amd64 \
            --cache-from type=gha,scope=docker-arm64 \
            --cache-from type=gha,scope=docker-publish \
            --output type=oci,dest=MsPacmanRipper-linux-multiarch.oci.tar \
            .

      - name: Upload OCI archive
        uses: actions/upload-artifact@v4
        with:
          name: MsPacmanRipper-linux-multiarch-oci
          path: MsPacmanRipper-linux-multiarch.oci.tar
