# Created by Jacob Hodgkins
name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Python scripts
        shell: pwsh
        run: python -m py_compile scripts/export_full_disassembly.py scripts/export_reassembly_source.py scripts/verify_data_semantics.py scripts/verify_semantic_families.py

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Smoke test executable
        shell: pwsh
        run: .\build\bin\MsPacmanRipper.exe --version

      - name: Smoke test Windows ZIP loader
        shell: pwsh
        run: |
          python -c "import zipfile; z=zipfile.ZipFile(r'build\\smoke.zip','w'); z.writestr('pacman.6e', bytes(4096)); z.close()"
          $output = & .\build\bin\MsPacmanRipper.exe .\build\smoke.zip .\build\smoke-output 2>&1
          $exitCode = $LASTEXITCODE
          $text = $output -join "`n"
          Write-Host $text
          if ($exitCode -ne 1) {
            throw "Expected canonical validation failure after successfully reading test ZIP; got exit code $exitCode"
          }
          if ($text -notmatch "canonical Ms. Pac-Man validation failed") {
            throw "Windows ZIP loader did not reach canonical validation."
          }
          Write-Host "Windows ZIP loader reached canonical validation as expected."
          exit 0

      - name: Assemble runnable Windows package
        if: success()
        shell: pwsh
        run: |
          $root = "dist/MsPacmanRipper"
          New-Item -ItemType Directory -Force "$root/bin" | Out-Null
          Copy-Item build/bin/MsPacmanRipper.exe "$root/bin/MsPacmanRipper.exe"
          Copy-Item scripts "$root/scripts" -Recurse
          Copy-Item evidence "$root/evidence" -Recurse
          Copy-Item README.md, LICENSE, LEGAL.md, VERSION, run_windows.bat "$root/"

      - name: Smoke test packaged runtime
        if: success()
        shell: pwsh
        run: .\dist\MsPacmanRipper\bin\MsPacmanRipper.exe --version

      - name: Upload runnable Windows package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MsPacmanRipper-Windows
          path: dist/MsPacmanRipper
